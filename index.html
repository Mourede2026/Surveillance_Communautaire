<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Surveillance à Base Communautaire</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Surveillance à Base Communautaire</h1>
    <p class="sub">Ministère de la Santé — République du Bénin</p>
    <form id="loginForm">
      <div class="field">
        <label>Numéro de téléphone</label>
        <input type="text" id="telephone" required placeholder="Ex: 97000000">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="motDePasse" required>
      </div>
      <button type="submit" class="btn-block">Se connecter</button>
    </form>
  </div>
</div>
<script src="assets/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const telephone = document.getElementById('telephone').value.trim();
  const motDePasse = document.getElementById('motDePasse').value;
  try {
    const data = await Api.call('login', { telephone, motDePasse });
    Session.setSession(data.token, data.user);
    const dest = { RC: 'rc.html', ASCQ: 'ascq.html', PF_CNLS_TP: 'pf.html', RCSE: 'rcse.html' }[data.user.Role];
    window.location.href = dest || 'index.html';
  } catch (err) {
    toast(err.message, true);
  }
});
</script>
</body>
</html>
