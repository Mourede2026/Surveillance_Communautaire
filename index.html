<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — SIVEC</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B3D3A">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIVEC">
<script src="assets/profil-menu.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="assets/icons/icon-512.png" alt="SIVEC" width="128" height="128">
    <h1>SIVEC</h1>
    <p class="sub">Système d’Information et de Veille Épidémiologique Communautaire<span class="sub-min">Ministère de la Santé — République du Bénin</span></p>
    <div id="repriseSession" class="reprise" style="display:none"></div>
    <form id="loginForm">
      <div class="field">
        <label>Numéro de téléphone</label>
        <input type="text" id="telephone" required placeholder="Ex: 97000000">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="motDePasse" required>
      </div>
      <button type="submit" class="btn-block">Se connecter</button>
    </form>
    <button type="button" id="btnPresentation" class="btn-presentation">▶ Découvrir SIVEC en 30 secondes</button>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/sivec-intro.js"></script>
<script>
// Animation d'ouverture : film de 30 s au tout premier lancement, puis logo animé (≈ 5 s) une fois par session.
(function () {
  var reduit = false, vu = false, dejaVu = false;
  try { reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  try { vu = !!localStorage.getItem('sivec_film_vu'); dejaVu = !!sessionStorage.getItem('sivec_splash'); } catch (e) {}
  function marquerVu(mode) { if (mode === 'film') { try { localStorage.setItem('sivec_film_vu', '1'); } catch (e) {} } }
  var bouton = document.getElementById('btnPresentation');
  if (bouton) bouton.onclick = function () { SivecIntro.ouvrir({ mode: 'film', onFin: marquerVu }); };
  if (!dejaVu && !reduit && window.SivecIntro) {
    try { sessionStorage.setItem('sivec_splash', '1'); } catch (e) {}
    SivecIntro.ouvrir({ mode: vu ? 'logo' : 'film', onFin: marquerVu });
  }
})();
</script>
<script>
// Session déjà ouverte sur cet appareil : on peut reprendre sans mot de passe, et SANS connexion internet
// (mode hors connexion : consultation des données déjà chargées, et notification pour le relais communautaire).
(function () {
  try {
    const u = Session.getUser(), t = Session.getToken();
    const dest = { RC: 'rc.html', ASCQ: 'ascq.html', PF_CNLS_TP: 'pf.html', RCSE: 'rcse.html', DEPARTEMENT: 'departement.html', NATIONAL: 'national.html' }[u && u.Role];
    if (!u || !t || !dest) return;
    const zone = document.getElementById('repriseSession');
    zone.style.display = '';
    zone.innerHTML = '<div class="reprise-nom">Session ouverte : <b>' + escHtml((u.Prenom || '') + ' ' + (u.Nom || '')) + '</b></div>' +
      '<button type="button" class="btn-block" id="btnReprise">Continuer' + (navigator.onLine === false ? ' (hors connexion)' : '') + '</button>' +
      '<div class="petit reprise-ou">ou connectez-vous avec un autre compte :</div>';
    document.getElementById('btnReprise').onclick = () => { window.location.href = dest; };
    if (navigator.onLine === false) window.location.replace(dest); // pas de réseau : impossible de se connecter, on reprend directement
  } catch (e) { /* page de connexion normale */ }
})();
try { const pf = sessionStorage.getItem('scb_prefill'); if (pf) { document.getElementById('telephone').value = pf; sessionStorage.removeItem('scb_prefill'); } } catch (e) {}
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const telephone = document.getElementById('telephone').value.trim();
  const motDePasse = document.getElementById('motDePasse').value;
  try {
    const data = await Api.call('login', { telephone, motDePasse });
    Session.setSession(data.token, data.user);
    const dest = { RC: 'rc.html', ASCQ: 'ascq.html', PF_CNLS_TP: 'pf.html', RCSE: 'rcse.html', DEPARTEMENT: 'departement.html', NATIONAL: 'national.html' }[data.user.Role];
    window.location.href = dest || 'index.html';
  } catch (err) {
    toast(err.message, true);
  }
});
</script>
<script src="assets/pwa-register.js"></script>
</body>
</html>
